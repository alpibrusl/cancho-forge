name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the commit in .cancho-rev, the one place to change it.
      - name: Read the compiler pin
        id: pin
        run: echo "rev=$(tr -d "[:space:]" < .cancho-rev)" >> "$GITHUB_OUTPUT"

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cancho-bin
          key: cancho-${{ steps.pin.outputs.rev }}-ubuntu-24.04

      - name: Check out cancho
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Build cancho
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd cancho
          cargo build --release -p cancho
          mkdir -p ~/cancho-bin
          cp target/release/cancho ~/cancho-bin/
          cp -r packages ~/cancho-bin/packages

      # fmt --check, check, test and the 2,000-line budget (CLAUDE.md).
      - name: The gate
        run: CANCHO=$HOME/cancho-bin/cancho sh scripts/gate.sh
