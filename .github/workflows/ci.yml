name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the release in .cancho-rev (equal to cancho.toml's pin), the one place to change it; installed prebuilt.
      - name: Install the pinned compiler
        run: |
          pin=$(tr -d "[:space:]" < .cancho-rev)
          test -n "$pin" || { echo ".cancho-rev is empty" >&2; exit 1; }
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # fmt --check, check, test and the 2,000-line budget (CLAUDE.md).
      - name: The gate
        run: CANCHO=$HOME/.local/bin/cancho sh scripts/gate.sh
