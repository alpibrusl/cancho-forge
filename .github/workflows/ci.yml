name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the commit in .cancho-rev, the one place to change it.
      - name: Read the compiler pin
        id: pin
        run: echo "rev=$(tr -d "[:space:]" < .cancho-rev)" >> "$GITHUB_OUTPUT"

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cancho-bin
          key: cancho-release-${{ steps.pin.outputs.rev }}-ubuntu-24.04

      - name: Check out cancho
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      # The released compiler (cancho built by cancho), not a Rust build: the prebuilt binary of the pinned commit,
      # checked against its published sha256 and the commit it reports (the pinned checkout's scripts/install.sh).
      # The checkout is only for install.sh and packages/.
      - name: Install the released cancho
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sh cancho/scripts/install.sh "${{ steps.pin.outputs.rev }}" "$HOME/cancho-inst"
          mkdir -p ~/cancho-bin
          cp "$HOME/cancho-inst/bin/cancho" ~/cancho-bin/
          cp -r cancho/packages ~/cancho-bin/packages

      # fmt --check, check, test and the 2,000-line budget (CLAUDE.md).
      - name: The gate
        run: CANCHO=$HOME/cancho-bin/cancho sh scripts/gate.sh
